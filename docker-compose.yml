version: '3.9'
services:
  app:
    build: .
    container_name: algorix-app
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - algorix-net

  web:
    image: nginx:alpine
    container_name: algorix-web
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - algorix-net

  db:
    image: postgres:15
    container_name: algorix-db
    environment:
      POSTGRES_DB: algorix
      POSTGRES_USER: algorix
      POSTGRES_PASSWORD: algorix
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - algorix-net

networks:
  algorix-net:
    driver: bridge

volumes:
  pgdata: